<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020818"/>
      <stop offset="55%" stop-color="#050e2a"/>
      <stop offset="100%" stop-color="#0a1a3a"/>
    </linearGradient>
    <!-- Stadium ground glow -->
    <radialGradient id="groundGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#1a6e2e" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#0d3a18" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <!-- Center spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffe066" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0"/>
    </radialGradient>
    <!-- Trophy body gold gradient -->
    <linearGradient id="trophyBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="12%" stop-color="#f5c842"/>
      <stop offset="30%" stop-color="#e0a800"/>
      <stop offset="50%" stop-color="#fffbe0"/>
      <stop offset="68%" stop-color="#c68b00"/>
      <stop offset="85%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#a06800"/>
    </linearGradient>
    <!-- Trophy shine highlight -->
    <linearGradient id="trophyShine" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#fffbe0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </linearGradient>
    <!-- Trophy base gradient -->
    <linearGradient id="trophyBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5200"/>
      <stop offset="20%" stop-color="#c89000"/>
      <stop offset="50%" stop-color="#ffe066"/>
      <stop offset="80%" stop-color="#c89000"/>
      <stop offset="100%" stop-color="#7a5200"/>
    </linearGradient>
    <!-- Trophy glow aura -->
    <radialGradient id="trophyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f5a800" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <!-- Cup bowl inner shadow -->
    <linearGradient id="bowlInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="40%" stop-color="#e0a800"/>
      <stop offset="100%" stop-color="#5a3800"/>
    </linearGradient>
    <!-- Stars layer -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Trophy glow filter -->
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft drop shadow -->
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- Flag shadow -->
    <filter id="flagShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- Stars scattered -->
  <g filter="url(#starGlow)" opacity="0.9">
    <circle cx="82" cy="38" r="1.1" fill="#fff"/>
    <circle cx="155" cy="70" r="0.8" fill="#fff"/>
    <circle cx="220" cy="22" r="1.3" fill="#fff"/>
    <circle cx="310" cy="55" r="0.9" fill="#fff"/>
    <circle cx="390" cy="18" r="1.1" fill="#fff"/>
    <circle cx="445" cy="72" r="0.7" fill="#fff"/>
    <circle cx="530" cy="30" r="1.4" fill="#ffe8a0"/>
    <circle cx="600" cy="14" r="0.9" fill="#fff"/>
    <circle cx="680" cy="48" r="1.2" fill="#fff"/>
    <circle cx="755" cy="25" r="0.8" fill="#fff"/>
    <circle cx="830" cy="60" r="1.0" fill="#fff"/>
    <circle cx="910" cy="18" r="1.3" fill="#fff"/>
    <circle cx="975" cy="75" r="0.7" fill="#fff"/>
    <circle cx="1045" cy="35" r="1.1" fill="#fff"/>
    <circle cx="1110" cy="20" r="0.9" fill="#ffe8a0"/>
    <circle cx="1170" cy="55" r="1.0" fill="#fff"/>
    <circle cx="120" cy="105" r="0.7" fill="#fff"/>
    <circle cx="270" cy="95" r="0.9" fill="#fff"/>
    <circle cx="480" cy="110" r="0.7" fill="#fff"/>
    <circle cx="720" cy="88" r="1.0" fill="#fff"/>
    <circle cx="950" cy="100" r="0.8" fill="#fff"/>
    <circle cx="1080" cy="95" r="1.1" fill="#fff"/>
    <circle cx="60" cy="140" r="0.8" fill="#fff"/>
    <circle cx="340" cy="130" r="0.6" fill="#fff"/>
    <circle cx="900" cy="135" r="0.9" fill="#fff"/>
    <circle cx="1140" cy="125" r="0.7" fill="#fff"/>
  </g>

  <!-- Stadium silhouette lights (top arc) -->
  <ellipse cx="600" cy="340" rx="570" ry="180" fill="none" stroke="#1a3a6e" stroke-width="1" stroke-dasharray="4 3" opacity="0.25"/>

  <!-- Stadium structure silhouette left -->
  <path d="M0,400 L0,630 L200,630 L200,420 Q250,350 180,310 L120,290 Q60,310 0,400Z" fill="#050d20" opacity="0.7"/>
  <!-- Stadium structure silhouette right -->
  <path d="M1200,400 L1200,630 L1000,630 L1000,420 Q950,350 1020,310 L1080,290 Q1140,310 1200,400Z" fill="#050d20" opacity="0.7"/>

  <!-- Stadium floodlights -->
  <g opacity="0.85">
    <!-- Left lights -->
    <rect x="155" y="278" width="8" height="40" fill="#8899bb" rx="2"/>
    <rect x="140" y="272" width="38" height="8" fill="#aabbcc" rx="2"/>
    <ellipse cx="159" cy="272" rx="30" ry="12" fill="#fffbe0" opacity="0.18"/>
    <!-- Right lights -->
    <rect x="1037" y="278" width="8" height="40" fill="#8899bb" rx="2"/>
    <rect x="1022" y="272" width="38" height="8" fill="#aabbcc" rx="2"/>
    <ellipse cx="1041" cy="272" rx="30" ry="12" fill="#fffbe0" opacity="0.18"/>
  </g>

  <!-- Field green glow -->
  <rect x="0" y="480" width="1200" height="150" fill="url(#groundGlow)"/>

  <!-- Center spotlight beam -->
  <rect width="1200" height="630" fill="url(#spotlight)"/>

  <!-- ── TROPHY GLOW AURA ── -->
  <ellipse cx="600" cy="400" rx="160" ry="130" fill="url(#trophyGlow)" filter="url(#glowFilter)" opacity="0.9"/>

  <!-- ── FIFA WORLD CUP TROPHY ── -->
  <!-- Shadow on ground -->
  <ellipse cx="600" cy="545" rx="62" ry="14" fill="#000" opacity="0.55"/>

  <!-- BASE PLATFORM -->
  <rect x="533" y="516" width="134" height="26" rx="5" fill="url(#trophyBase)" filter="url(#softShadow)"/>
  <rect x="545" y="512" width="110" height="10" rx="3" fill="url(#trophyBase)"/>
  <!-- Base stripe detail -->
  <rect x="533" y="520" width="134" height="3" fill="#ffe066" opacity="0.4"/>
  <rect x="533" y="530" width="134" height="2" fill="#7a5200" opacity="0.5"/>

  <!-- STEM lower -->
  <path d="M570,512 Q575,495 580,475 L620,475 Q625,495 630,512Z" fill="url(#trophyBody)"/>
  <!-- Stem highlight -->
  <path d="M594,512 Q596,495 598,475 L604,475 Q602,495 600,512Z" fill="url(#trophyShine)" opacity="0.6"/>

  <!-- RING / COLLAR -->
  <ellipse cx="600" cy="474" rx="42" ry="10" fill="url(#trophyBase)"/>
  <ellipse cx="600" cy="474" rx="34" ry="7" fill="#b87800" opacity="0.5"/>

  <!-- STEM upper (thin) -->
  <path d="M584,474 Q588,450 590,428 L610,428 Q612,450 616,474Z" fill="url(#trophyBody)"/>
  <path d="M597,474 Q598,450 599,428 L603,428 Q602,450 601,474Z" fill="url(#trophyShine)" opacity="0.55"/>

  <!-- EARTH GLOBE (green on gold) -->
  <ellipse cx="600" cy="398" rx="52" ry="32" fill="url(#trophyBody)"/>
  <!-- Globe continents suggestion -->
  <ellipse cx="600" cy="398" rx="48" ry="28" fill="#1a6e2e" opacity="0.22"/>
  <path d="M568,388 Q575,382 585,386 Q590,378 598,382 Q605,376 614,381 Q622,376 630,383 Q636,390 630,396 Q622,390 614,395 Q605,390 598,386 Q590,392 582,396 Q574,396 568,388Z" fill="#1a8033" opacity="0.45"/>
  <path d="M572,408 Q580,402 592,406 Q600,400 610,405 Q618,402 626,408 Q620,415 610,413 Q600,418 590,413 Q580,416 572,408Z" fill="#1a8033" opacity="0.35"/>
  <!-- Globe shine -->
  <ellipse cx="588" cy="386" rx="18" ry="10" fill="#fffbe8" opacity="0.3" transform="rotate(-20,588,386)"/>

  <!-- HANDLES left -->
  <path d="M548,398 Q530,378 538,355 Q548,340 562,348 Q552,362 556,378 Q562,390 570,395Z" fill="url(#trophyBody)" stroke="#c89000" stroke-width="0.5"/>
  <path d="M554,382 Q544,368 550,355 Q554,348 558,350 Q550,364 554,375Z" fill="url(#trophyShine)" opacity="0.4"/>

  <!-- HANDLES right -->
  <path d="M652,398 Q670,378 662,355 Q652,340 638,348 Q648,362 644,378 Q638,390 630,395Z" fill="url(#trophyBody)" stroke="#c89000" stroke-width="0.5"/>
  <path d="M646,382 Q656,368 650,355 Q646,348 642,350 Q650,364 646,375Z" fill="url(#trophyShine)" opacity="0.4"/>

  <!-- BOWL upper cup shape -->
  <path d="M548,398 Q542,360 552,330 Q562,310 600,305 Q638,310 648,330 Q658,360 652,398 Q635,412 600,415 Q565,412 548,398Z" fill="url(#trophyBody)"/>
  <!-- Bowl inner dark -->
  <path d="M558,395 Q554,362 562,336 Q570,318 600,314 Q630,318 638,336 Q646,362 642,395 Q628,408 600,411 Q572,408 558,395Z" fill="url(#bowlInner)" opacity="0.35"/>
  <!-- Bowl main shine highlight -->
  <path d="M563,360 Q560,336 568,320 Q578,310 596,308 Q606,320 604,342 Q600,358 580,368 Q568,368 563,360Z" fill="url(#trophyShine)" opacity="0.75"/>
  <!-- Secondary highlight right -->
  <path d="M628,350 Q634,336 632,322 Q628,314 618,310 Q612,326 616,342 Q620,354 628,350Z" fill="#fffbe8" opacity="0.3"/>

  <!-- Globe ring around middle -->
  <ellipse cx="600" cy="428" rx="36" ry="8" fill="url(#trophyBase)" opacity="0.9"/>

  <!-- Gleam sparkles around trophy -->
  <g fill="#ffe066" opacity="0.85">
    <polygon points="545,300 548,308 556,308 550,313 552,321 545,316 538,321 540,313 534,308 542,308" transform="scale(0.55) translate(445,210)"/>
    <polygon points="545,300 548,308 556,308 550,313 552,321 545,316 538,321 540,313 534,308 542,308" transform="scale(0.38) translate(1730,550)" opacity="0.7"/>
    <polygon points="545,300 548,308 556,308 550,313 552,321 545,316 538,321 540,313 534,308 542,308" transform="scale(0.42) translate(680,420)" opacity="0.6"/>
  </g>
  <!-- Simple 4-point sparkles -->
  <g fill="#fffbe0" opacity="0.9">
    <path d="M536,316 L538,310 L540,316 L546,318 L540,320 L538,326 L536,320 L530,318Z"/>
    <path d="M658,310 L660,304 L662,310 L668,312 L662,314 L660,320 L658,314 L652,312Z"/>
    <path d="M600,285 L602,279 L604,285 L610,287 L604,289 L602,295 L600,289 L594,287Z"/>
    <path d="M524,378 L525.5,373 L527,378 L532,379.5 L527,381 L525.5,386 L524,381 L519,379.5Z" opacity="0.7"/>
    <path d="M674,372 L675.5,367 L677,372 L682,373.5 L677,375 L675.5,380 L674,375 L669,373.5Z" opacity="0.7"/>
  </g>

  <!-- ── FLAGS ── -->
  <!-- USA flag — left -->
  <g filter="url(#flagShadow)" transform="translate(96,195)">
    <rect width="108" height="72" rx="4" fill="#fff"/>
    <!-- Red stripes -->
    <rect width="108" height="72" rx="4" fill="#B22234"/>
    <rect y="5.54" width="108" height="5.54" fill="#fff"/>
    <rect y="16.62" width="108" height="5.54" fill="#fff"/>
    <rect y="27.69" width="108" height="5.54" fill="#fff"/>
    <rect y="38.77" width="108" height="5.54" fill="#fff"/>
    <rect y="49.85" width="108" height="5.54" fill="#fff"/>
    <rect y="60.92" width="108" height="5.54" fill="#fff"/>
    <!-- Canton blue -->
    <rect width="46" height="38.77" rx="2" fill="#3C3B6E"/>
    <!-- Stars (simplified grid) -->
    <g fill="#fff" font-size="5">
      <text x="4" y="8">★★★★★★</text>
      <text x="6.5" y="14">★★★★★</text>
      <text x="4" y="20">★★★★★★</text>
      <text x="6.5" y="26">★★★★★</text>
      <text x="4" y="32">★★★★★★</text>
      <text x="6.5" y="38">★★★★★</text>
    </g>
    <!-- Border shine -->
    <rect width="108" height="72" rx="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- USA label -->
  <text x="150" y="284" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" font-weight="900" fill="#ffe066" letter-spacing="2">USA</text>

  <!-- CANADA flag — right -->
  <g filter="url(#flagShadow)" transform="translate(996,195)">
    <rect width="108" height="72" rx="4" fill="#FF0000"/>
    <rect x="27" y="0" width="54" height="72" rx="0" fill="#fff"/>
    <!-- Maple leaf simplified -->
    <text x="54" y="46" text-anchor="middle" font-size="34" fill="#FF0000">🍁</text>
    <!-- Border shine -->
    <rect width="108" height="72" rx="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Canada label -->
  <text x="1050" y="284" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" font-weight="900" fill="#ffe066" letter-spacing="2">CANADÁ</text>

  <!-- MEXICO flag — below trophy, left side -->
  <!-- Position it subtly bottom-center-left -->
  <g filter="url(#flagShadow)" transform="translate(430,490)">
    <rect width="96" height="64" rx="4" fill="#006847"/>
    <rect x="32" y="0" width="32" height="64" fill="#fff"/>
    <rect x="64" y="0" width="32" height="64" rx="4" fill="#CE1126"/>
    <!-- Eagle coat of arms simplified -->
    <text x="48" y="40" text-anchor="middle" font-size="22" fill="#8B5E00">🦅</text>
    <rect width="96" height="64" rx="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
  </g>
  <text x="478" y="570" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="13" font-weight="900" fill="#ffe066" letter-spacing="2">MÉXICO</text>

  <!-- ── TITLE TEXT ── -->
  <!-- Main title glow layer -->
  <text x="600" y="158" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="72" font-weight="900"
    fill="#ffd700" opacity="0.18"
    filter="url(#glowFilter)"
    letter-spacing="8">FIFA WORLD CUP</text>
  <!-- Main title -->
  <text x="600" y="158" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="72" font-weight="900"
    letter-spacing="8"
    fill="none"
    stroke="#ffd700" stroke-width="1.5">FIFA WORLD CUP</text>
  <text x="600" y="158" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="72" font-weight="900"
    letter-spacing="8"
    fill="url(#trophyBody)">FIFA WORLD CUP</text>

  <!-- Year -->
  <text x="600" y="220" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="100" font-weight="900"
    letter-spacing="12"
    fill="url(#trophyBody)" opacity="0.95">2026</text>
  <!-- Year border -->
  <text x="600" y="220" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="100" font-weight="900"
    letter-spacing="12"
    fill="none" stroke="#a06800" stroke-width="1">2026</text>

  <!-- Subtitle -->
  <text x="600" y="252" text-anchor="middle"
    font-family="Arial,sans-serif"
    font-size="18" font-weight="700"
    fill="#aac4f0" letter-spacing="6" opacity="0.85">QUINIELA · 16avos de Final</text>

  <!-- Horizontal golden rule lines flanking subtitle -->
  <line x1="120" y1="244" x2="355" y2="244" stroke="#ffd700" stroke-width="1" opacity="0.4"/>
  <line x1="845" y1="244" x2="1080" y2="244" stroke="#ffd700" stroke-width="1" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="600" y="608" text-anchor="middle"
    font-family="Arial,sans-serif"
    font-size="15" fill="#6a8ab0" letter-spacing="3">USA · CANADA · MÉXICO  •  2026</text>

  <!-- Vignette overlay edges -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#020818" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#vignette)"/>
</svg>
